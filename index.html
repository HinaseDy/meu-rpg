<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nome da Cidade</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 65% 40%,
            #353535 0%,
            #171717 35%,
            #050505 75%
        );

    color: #eeeeee;
    font-family: Georgia, serif;
}


/* =========================
   CENÁRIO
========================= */

.cenario {
    position: fixed;
    inset: 0;
    overflow: hidden;
}


/* =========================
   ESTRELAS
========================= */

.estrelas {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle at 10% 15%, white 0 1px, transparent 2px),
        radial-gradient(circle at 22% 8%, white 0 1px, transparent 2px),
        radial-gradient(circle at 35% 20%, white 0 1px, transparent 2px),
        radial-gradient(circle at 48% 9%, white 0 1px, transparent 2px),
        radial-gradient(circle at 65% 17%, white 0 1px, transparent 2px),
        radial-gradient(circle at 80% 8%, white 0 1px, transparent 2px),
        radial-gradient(circle at 92% 25%, white 0 1px, transparent 2px);

    opacity: 0.6;
}


/* =========================
   ÁRVORES
========================= */

.arvores {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 55%,
            rgba(0,0,0,0.8) 56%,
            transparent 57%
        ),
        linear-gradient(
            70deg,
            transparent 63%,
            rgba(0,0,0,0.7) 64%,
            transparent 65%
        );

    opacity: 0.8;
}


/* =========================
   NÉVOA
========================= */

.nevoa {
    position: absolute;

    width: 150%;
    height: 45%;

    left: -25%;
    bottom: 0;

    background:
        radial-gradient(
            ellipse,
            rgba(180,180,180,0.08),
            transparent 70%
        );

    filter: blur(25px);

    animation: nevoa 12s ease-in-out infinite alternate;
}

@keyframes nevoa {

    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }

}


/* =========================
   LUA
========================= */

.lua {
    position: absolute;

    top: 10%;
    right: 10%;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f5f5f5,
            #d8d8d8 45%,
            #999999 100%
        );

    box-shadow:
        0 0 20px rgba(255,255,255,0.3),
        0 0 60px rgba(255,255,255,0.15);

    opacity: 0.8;
}


/* =========================
   ESTRELA VERMELHA
========================= */

.estrela {
    position: absolute;

    top: 30%;
    left: 42%;

    width: 80px;
    height: 80px;

    transform: rotate(45deg);

    background: #d40000;

    clip-path: polygon(
        50% 0%,
        60% 40%,
        100% 50%,
        60% 60%,
        50% 100%,
        40% 60%,
        0% 50%,
        40% 40%
    );

    filter:
        drop-shadow(0 0 8px rgba(255,0,0,0.8))
        drop-shadow(0 0 20px rgba(255,0,0,0.3));

    animation: pulsar 4s ease-in-out infinite;
}

@keyframes pulsar {

    0%, 100% {
        opacity: 0.75;
        transform: rotate(45deg) scale(0.95);
    }

    50% {
        opacity: 1;
        transform: rotate(45deg) scale(1.08);
    }

}


/* =========================
   CORVO
========================= */

.corvo {
    position: absolute;

    right: 12%;
    top: 23%;

    width: 220px;
    height: 170px;

    z-index: 3;

    animation: voar 4s ease-in-out infinite;
}

@keyframes voar {

    0%,100% {
        transform: translateY(0) rotate(-3deg);
    }

    50% {
        transform: translateY(-8px) rotate(2deg);
    }

}

.corvo-corpo {
    position: absolute;

    width: 100px;
    height: 120px;

    right: 45px;
    top: 45px;

    background: #030303;

    border-radius: 50%;
}

.corvo-cabeca {
    position: absolute;

    width: 75px;
    height: 75px;

    right: 25px;
    top: 15px;

    background: #020202;

    border-radius: 50%;
}

.corvo-bico {
    position: absolute;

    right: -60px;
    top: 25px;

    width: 70px;
    height: 25px;

    background: #010101;

    clip-path: polygon(
        0 0,
        100% 50%,
        0 100%
    );
}

.corvo-asa {
    position: absolute;

    width: 140px;
    height: 70px;

    left: 0;
    top: 45px;

    background: #010101;

    border-radius: 80% 20% 80% 20%;

    transform: rotate(15deg);
}

.corvo-cauda {
    position: absolute;

    left: 30px;
    bottom: 0;

    width: 110px;
    height: 55px;

    background: #010101;

    clip-path: polygon(
        100% 0,
        0 20%,
        35% 50%,
        0 80%,
        100% 100%
    );
}

.corvo-olho {
    position: absolute;

    right: 48px;
    top: 40px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: red;

    box-shadow:
        0 0 8px red,
        0 0 18px rgba(255,0,0,0.8);

    z-index: 10;
}


/* =========================
   INTERFACE INICIAL
========================= */

.interface {
    position: absolute;

    left: 6%;
    top: 12%;

    width: 390px;

    z-index: 10;
}

.titulo {
    position: relative;

    text-align: center;

    padding: 30px 10px;

    font-size: clamp(30px, 4vw, 52px);

    letter-spacing: 2px;

    color: #e5e5e5;

    text-shadow:
        0 0 5px #000,
        0 0 15px #000;
}

.titulo::before,
.titulo::after {

    content: "❦";

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    color: #cfcfcf;

    font-size: 45px;
}

.titulo::before {
    top: -15px;
}

.titulo::after {
    bottom: -15px;
}

.boasvindas {

    margin-top: 35px;
    margin-left: 20px;

    font-size: 26px;

    color: #dddddd;

    text-shadow: 0 2px 5px black;
}

.menu {

    margin-top: 25px;

    display: flex;

    flex-direction: column;

    gap: 14px;

    width: 320px;
}

.botao {

    position: relative;

    width: 280px;

    padding: 13px 28px;

    background: transparent;

    border: none;

    color: #dddddd;

    text-align: left;

    font-family: Georgia, serif;

    font-size: 25px;

    cursor: pointer;

    transition: 0.3s;

    text-shadow: 0 2px 4px black;
}

.botao::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: -1;

    background: #777;

    clip-path: polygon(
        0 0,
        88% 0,
        100% 50%,
        88% 100%,
        0 100%,
        8% 50%
    );

    opacity: 0.75;

    transition: 0.3s;
}

.botao:hover {

    color: white;

    transform: translateX(8px);
}

.botao:hover::before {

    background: #8b1515;

    opacity: 0.95;

    box-shadow: 0 0 20px #8b1515;
}

.jogar {

    font-size: 34px;

    letter-spacing: 3px;

    border: 1px solid rgba(160,20,20,0.7);
}

.jogar::before {

    background: #777;

    box-shadow:
        0 0 0 2px #530000,
        0 0 12px rgba(150,0,0,0.5);
}

.desistir {

    width: 170px;

    margin-top: 20px;

    font-size: 18px;

    opacity: 0.75;
}


/* =========================
   ESCOLHA PLAYER / MESTRE
========================= */

.tela-escolha {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle,
            rgba(70,0,0,0.35),
            #050505 75%
        );

    opacity: 0;

    visibility: hidden;

    transition: opacity 0.7s ease;
}

.tela-escolha.visivel {

    opacity: 1;

    visibility: visible;
}

.tela-escolha h2 {

    font-size: clamp(30px, 6vw, 55px);

    letter-spacing: 4px;

    margin-bottom: 45px;

    text-shadow:
        0 0 10px black,
        0 0 25px rgba(150,0,0,0.5);
}

.opcoes {

    width: min(85%, 650px);

    display: flex;

    flex-direction: column;

    gap: 25px;
}

.opcao {

    width: 100%;

    min-height: 120px;

    padding: 25px;

    border: 2px solid #650000;

    background:
        linear-gradient(
            90deg,
            #260000,
            #550000,
            #260000
        );

    color: #eee;

    font-family: Georgia, serif;

    font-size: clamp(22px, 4vw, 34px);

    letter-spacing: 2px;

    cursor: pointer;

    transition: 0.3s;
}

.opcao:hover {

    transform: scale(1.03);

    border-color: #d00000;

    background:
        linear-gradient(
            90deg,
            #550000,
            #900000,
            #550000
        );

    box-shadow:
        0 0 30px rgba(180,0,0,0.5);
}

.descricao {

    display: block;

    margin-top: 8px;

    font-size: 15px;

    color: #c0aaaa;

    letter-spacing: 1px;
}


/* =========================
   CRIAÇÃO
========================= */

.tela-criacao {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    flex-direction: column;

    align-items: center;

    overflow-y: auto;

    padding: 45px 20px 70px;

    background:
        radial-gradient(
            circle at center,
            rgba(70,0,0,0.3),
            #060606 75%
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition: opacity 0.7s ease;
}

.tela-criacao.visivel {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.tela-criacao h2 {

    font-size: clamp(30px, 6vw, 55px);

    letter-spacing: 4px;

    text-shadow:
        0 0 10px black,
        0 0 25px rgba(150,0,0,0.5);

    margin-bottom: 10px;

    text-align: center;
}

.subtitulo {

    color: #bca5a5;

    font-size: 18px;

    margin-bottom: 35px;

    text-align: center;
}

.formulario {

    width: min(90vw, 700px);

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.formulario label {

    font-size: 20px;

    margin-top: 10px;

    color: #ddd;
}

.campo {

    width: 100%;

    border: 1px solid #650000;

    background: rgba(10,10,10,0.9);

    color: white;

    font-family: Georgia, serif;

    font-size: 19px;

    outline: none;

    transition: 0.3s;
}

.campo:focus {

    border-color: #c00000;

    box-shadow:
        0 0 15px rgba(180,0,0,0.35);
}

input.campo {

    height: 55px;

    padding: 12px 16px;
}

textarea.campo {

    min-height: 300px;

    padding: 16px;

    resize: vertical;

    line-height: 1.6;
}

.campo::placeholder {

    color: #777;
}

.continuar {

    align-self: center;

    margin-top: 25px;

    padding: 16px 55px;

    background:
        linear-gradient(
            90deg,
            #420000,
            #790000,
            #420000
        );

    border: 1px solid #900000;

    color: white;

    font-family: Georgia, serif;

    font-size: 22px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.3s;
}

.continuar:hover {

    transform: scale(1.05);

    box-shadow:
        0 0 25px rgba(190,0,0,0.5);
}


/* =========================
   CORTINA
========================= */

.cortina {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 9999;

    background:
        linear-gradient(
            90deg,
            #350000,
            #720000,
            #a80000,
            #680000,
            #a80000,
            #680000,
            #a80000,
            #720000,
            #350000
        );

    transform: translateY(-101%);

    transition:
        transform 1s ease-in-out;

    touch-action: none;

    pointer-events: none;
}

.cortina::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,0.25) 0px,
            rgba(255,255,255,0.08) 30px,
            rgba(0,0,0,0.30) 60px
        );
}

.cortina.fechada {

    transform: translateY(0);

    pointer-events: auto;

    cursor: grab;
}

.cortina.arrastando {

    transition: none;

    cursor: grabbing;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .interface {

        left: 5%;
        top: 8%;

        width: 55%;
    }

    .titulo {

        font-size: 28px;
    }

    .boasvindas {

        font-size: 20px;
    }

    .botao {

        width: 220px;

        font-size: 20px;
    }

    .jogar {

        font-size: 28px;
    }

    .lua {

        width: 110px;
        height: 110px;
    }

    .corvo {

        right: -5%;
        top: 25%;

        transform: scale(0.65);
    }

    .tela-escolha h2 {

        text-align: center;

        font-size: 32px;
    }

}

</style>
</head>


<body>


<!-- =========================
     CENÁRIO
========================= -->

<div class="cenario">

    <div class="estrelas"></div>

    <div class="arvores"></div>

    <div class="nevoa"></div>

    <div class="lua"></div>

    <div class="estrela"></div>


    <!-- CORVO -->

    <div class="corvo">

        <div class="corvo-corpo"></div>

        <div class="corvo-cabeca">

            <div class="corvo-bico"></div>

        </div>

        <div class="corvo-asa"></div>

        <div class="corvo-cauda"></div>

        <div class="corvo-olho"></div>

    </div>


    <!-- =========================
         TELA INICIAL
    ========================= -->

    <section class="interface">

        <h1 class="titulo">
            Nome da Cidade
        </h1>

        <div class="boasvindas">
            Bem-vindo
        </div>

        <div class="menu">

            <button
                class="botao jogar"
                id="botaoJogar"
            >
                JOGAR
            </button>

            <button class="botao">
                CONTINUAR
            </button>

            <button class="botao desistir">
                Desistir
            </button>

        </div>

    </section>

</div>


<!-- =========================
     ESCOLHA
========================= -->

<section
    class="tela-escolha"
    id="telaEscolha"
>

    <h2>
        ESCOLHA SEU CAMINHO
    </h2>

    <div class="opcoes">

        <button
            class="opcao"
            id="botaoPlayer"
        >

            JOGAR COMO JOGADOR

            <span class="descricao">
                Viva a história através do seu personagem.
            </span>

        </button>


        <button class="opcao">

            JOGAR COMO MESTRE

            <span class="descricao">
                Conduza a história e controle o mundo.
            </span>

        </button>

    </div>

</section>


<!-- =========================
     CRIAÇÃO
========================= -->

<section
    class="tela-criacao"
    id="telaCriacao"
>

    <h2>
        CRIAÇÃO DO PERSONAGEM
    </h2>

    <p class="subtitulo">
        Sua história começa aqui.
    </p>


    <div class="formulario">

        <label for="nomePersonagem">
            Nome do personagem
        </label>

        <input
            id="nomePersonagem"
            class="campo"
            type="text"
            maxlength="60"
            placeholder="Digite o nome do seu personagem..."
        >


        <label for="historiaPersonagem">
            História
        </label>

        <textarea
            id="historiaPersonagem"
            class="campo"
            placeholder="Escreva ou cole aqui a história do seu personagem..."
        ></textarea>


        <button
            class="continuar"
            id="botaoContinuar"
        >
            CONTINUAR
        </button>

    </div>

</section>


<!-- =========================
     CORTINA
========================= -->

<div
    class="cortina"
    id="cortina"
></div>


<script>

/* =========================
   ELEMENTOS
========================= */

const botaoJogar =
    document.getElementById("botaoJogar");

const cortina =
    document.getElementById("cortina");

const telaEscolha =
    document.getElementById("telaEscolha");

const botaoPlayer =
    document.getElementById("botaoPlayer");

const telaCriacao =
    document.getElementById("telaCriacao");

const botaoContinuar =
    document.getElementById("botaoContinuar");


/* =========================
   ABRIR CORTINA
========================= */

botaoJogar.addEventListener(
    "click",
    function() {

        cortina.classList.add("fechada");

    }
);


/* =========================
   ARRASTAR CORTINA
========================= */

let arrastando = false;

let inicioY = 0;

let porcentagem = 0;


/* COMEÇAR */

function iniciarArrasto(y) {

    if (!cortina.classList.contains("fechada")) {
        return;
    }

    arrastando = true;

    inicioY = y;

    cortina.classList.add("arrastando");

}


/* MOVER */

function moverArrasto(y) {

    if (!arrastando) {
        return;
    }

    const movimento =
        y - inicioY;

    porcentagem =
        (movimento / window.innerHeight) * 100;

    porcentagem =
        Math.max(
            -100,
            Math.min(0, porcentagem)
        );

    cortina.style.transform =
        "translateY(" + porcentagem + "%)";

}


/* TERMINAR */

function terminarArrasto() {

    if (!arrastando) {
        return;
    }

    arrastando = false;

    cortina.classList.remove("arrastando");


    /* Se puxou o suficiente */

    if (porcentagem <= -35) {

        cortina.style.transform =
            "translateY(-101%)";

        cortina.classList.remove("fechada");

        porcentagem = -101;


        setTimeout(
            function() {

                telaEscolha.classList.add("visivel");

            },
            400
        );

    }

    /* Se não puxou suficiente */

    else {

        cortina.style.transform =
            "translateY(0%)";

        porcentagem = 0;

    }

}


/* =========================
   TOUCH
========================= */

cortina.addEventListener(
    "touchstart",
    function(evento) {

        iniciarArrasto(
            evento.touches[0].clientY
        );

    }
);


cortina.addEventListener(
    "touchmove",
    function(evento) {

        moverArrasto(
            evento.touches[0].clientY
        );

        evento.preventDefault();

    },
    { passive: false }
);


cortina.addEventListener(
    "touchend",
    function() {

        terminarArrasto();

    }
);


/* =========================
   MOUSE
========================= */

cortina.addEventListener(
    "mousedown",
    function(evento) {

        iniciarArrasto(
            evento.clientY
        );

    }
);


window.addEventListener(
    "mousemove",
    function(evento) {

        moverArrasto(
            evento.clientY
        );

    }
);


window.addEventListener(
    "mouseup",
    function() {

        terminarArrasto();

    }
);


/* =========================
   JOGAR COMO JOGADOR
========================= */

botaoPlayer.addEventListener(
    "click",
    function() {

        telaEscolha.classList.remove("visivel");

        setTimeout(
            function() {

                telaCriacao.classList.add("visivel");

            },
            350
        );

    }
);


/* =========================
   CONTINUAR
========================= */

botaoContinuar.addEventListener(
    "click",
    function() {

        const nome =
            document
            .getElementById("nomePersonagem")
            .value
            .trim();

        const historia =
            document
            .getElementById("historiaPersonagem")
            .value
            .trim();


        if (nome === "") {

            alert(
                "Digite o nome do personagem."
            );

            return;
        }


        if (historia === "") {

            alert(
                "Escreva a história do personagem."
            );

            return;
        }


        /* Salva temporariamente */

        localStorage.setItem(
            "nomePersonagem",
            nome
