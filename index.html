<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nome da Cidade</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 65% 40%,
            #353535 0%,
            #171717 35%,
            #050505 75%
        );

    color: #eeeeee;
    font-family: Georgia, serif;
}


/* =========================
   CENÁRIO
========================= */

.cenario {
    position: fixed;
    inset: 0;
    overflow: hidden;
}


/* =========================
   ESTRELAS
========================= */

.estrelas {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle at 12% 18%, white 0 1px, transparent 2px),
        radial-gradient(circle at 25% 8%, white 0 1px, transparent 2px),
        radial-gradient(circle at 38% 22%, white 0 1px, transparent 2px),
        radial-gradient(circle at 52% 10%, white 0 1px, transparent 2px),
        radial-gradient(circle at 68% 18%, white 0 1px, transparent 2px),
        radial-gradient(circle at 82% 7%, white 0 1px, transparent 2px),
        radial-gradient(circle at 91% 28%, white 0 1px, transparent 2px),
        radial-gradient(circle at 7% 38%, white 0 1px, transparent 2px),
        radial-gradient(circle at 31% 35%, white 0 1px, transparent 2px),
        radial-gradient(circle at 74% 34%, white 0 1px, transparent 2px);

    opacity: 0.65;
    z-index: 1;
}


/* =========================
   ÁRVORES
========================= */

.arvores {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 55%,
            rgba(0,0,0,0.8) 56%,
            transparent 57%
        ),
        linear-gradient(
            70deg,
            transparent 63%,
            rgba(0,0,0,0.7) 64%,
            transparent 65%
        );

    opacity: 0.8;
    z-index: 2;
}


/* =========================
   CIDADE
========================= */

.cidade {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 38%;

    background: #050505;

    z-index: 3;

    clip-path: polygon(
        0 65%,
        5% 62%,
        5% 48%,
        10% 48%,
        10% 58%,
        15% 58%,
        15% 35%,
        20% 35%,
        20% 55%,
        25% 55%,
        25% 42%,
        30% 42%,
        30% 53%,
        36% 53%,
        36% 30%,
        41% 30%,
        41% 50%,
        47% 50%,
        47% 40%,
        52% 40%,
        52% 55%,
        58% 55%,
        58% 32%,
        64% 32%,
        64% 50%,
        70% 50%,
        70% 38%,
        76% 38%,
        76% 54%,
        82% 54%,
        82% 43%,
        88% 43%,
        88% 55%,
        94% 55%,
        94% 46%,
        100% 46%,
        100% 100%,
        0 100%
    );
}


/* Luzes */

.cidade::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(circle at 18% 65%, #a00000 0 2px, transparent 4px),
        radial-gradient(circle at 42% 67%, #a00000 0 2px, transparent 4px),
        radial-gradient(circle at 60% 60%, #a00000 0 2px, transparent 4px),
        radial-gradient(circle at 72% 67%, #a00000 0 2px, transparent 4px),
        radial-gradient(circle at 86% 61%, #a00000 0 2px, transparent 4px);
}


/* =========================
   NÉVOA
========================= */

.nevoa {
    position: absolute;

    width: 150%;
    height: 45%;

    left: -25%;
    bottom: 0;

    background:
        radial-gradient(
            ellipse,
            rgba(180,180,180,0.08),
            transparent 70%
        );

    filter: blur(25px);

    animation: nevoa 12s ease-in-out infinite alternate;

    z-index: 4;
}

@keyframes nevoa {

    from {
        transform: translateX(-3%);
    }

    to {
        transform: translateX(3%);
    }

}


/* =========================
   LUA
========================= */

.lua {
    position: absolute;

    top: 10%;
    right: 10%;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f5f5f5,
            #d8d8d8 45%,
            #999999 100%
        );

    box-shadow:
        0 0 20px rgba(255,255,255,0.3),
        0 0 60px rgba(255,255,255,0.15);

    z-index: 5;
}

.lua::before {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(80,80,80,0.2) 0 15px,
            transparent 16px
        ),
        radial-gradient(
            circle at 65% 45%,
            rgba(80,80,80,0.15) 0 20px,
            transparent 21px
        ),
        radial-gradient(
            circle at 40% 75%,
            rgba(80,80,80,0.18) 0 14px,
            transparent 15px
        );
}


/* =========================
   ESTRELA
========================= */

.estrela {
    position: absolute;

    top: 30%;
    left: 42%;

    width: 80px;
    height: 80px;

    transform: rotate(45deg);

    background: #d40000;

    clip-path: polygon(
        50% 0%,
        60% 40%,
        100% 50%,
        60% 60%,
        50% 100%,
        40% 60%,
        0% 50%,
        40% 40%
    );

    filter:
        drop-shadow(0 0 8px rgba(255,0,0,0.8))
        drop-shadow(0 0 20px rgba(255,0,0,0.3));

    animation: pulsar 4s ease-in-out infinite;

    z-index: 6;
}

@keyframes pulsar {

    0%, 100% {
        opacity: 0.75;
        transform: rotate(45deg) scale(0.95);
    }

    50% {
        opacity: 1;
        transform: rotate(45deg) scale(1.08);
    }

}


/* =========================
   CORVO
========================= */

.corvo {
    position: absolute;

    right: 12%;
    top: 23%;

    width: 230px;
    height: 180px;

    z-index: 7;

    animation: corvoFlutuar 4s ease-in-out infinite;
}

@keyframes corvoFlutuar {

    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-7px) rotate(-3deg);
    }

}

.corvo-corpo {
    position: absolute;

    width: 105px;
    height: 125px;

    right: 45px;
    top: 45px;

    background: #030303;

    border-radius: 50%;
}

.corvo-cabeca {
    position: absolute;

    width: 78px;
    height: 78px;

    right: 25px;
    top: 18px;

    background: #020202;

    border-radius: 50%;

    z-index: 2;
}

.corvo-bico {
    position: absolute;

    right: -65px;
    top: 45px;

    width: 75px;
    height: 28px;

    background: #020202;

    clip-path: polygon(
        0 0,
        100% 50%,
        0 100%
    );
}

.corvo-asa-esquerda {
    position: absolute;

    width: 135px;
    height: 70px;

    left: 5px;
    top: 45px;

    background: #010101;

    border-radius: 80% 20% 80% 20%;

    transform: rotate(18deg);
}

.corvo-asa-direita {
    position: absolute;

    width: 125px;
    height: 65px;

    right: 35px;
    top: 95px;

    background: #010101;

    border-radius: 20% 80% 20% 80%;

    transform: rotate(-25deg);
}

.corvo-cauda {
    position: absolute;

    left: 35px;
    bottom: 5px;

    width: 105px;
    height: 60px;

    background: #010101;

    clip-path: polygon(
        100% 0,
        0 20%,
        35% 50%,
        0 80%,
        100% 100%
    );
}

.corvo-olho {
    position: absolute;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #ff0000;

    box-shadow:
        0 0 6px #ff0000,
        0 0 18px rgba(255,0,0,0.9);

    z-index: 5;
}

.olho-esquerdo {
    right: 70px;
    top: 48px;
}

.olho-direito {
    right: 50px;
    top: 49px;
}


/* =========================
   PRIMEIRA INTERFACE
========================= */

.interface {
    position: absolute;

    left: 6%;
    top: 12%;

    width: 390px;

    z-index: 20;
}

.titulo {
    position: relative;

    text-align: center;

    padding: 30px 10px;

    font-size: clamp(30px, 4vw, 52px);

    letter-spacing: 2px;

    color: #e5e5e5;

    text-shadow:
        0 0 5px #000,
        0 0 15px #000;
}

.titulo::before,
.titulo::after {

    content: "❦";

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    color: #cfcfcf;

    font-size: 45px;
}

.titulo::before {
    top: -15px;
}

.titulo::after {
    bottom: -15px;
}

.boasvindas {

    margin-top: 35px;
    margin-left: 20px;

    font-size: 26px;

    color: #dddddd;

    text-shadow: 0 2px 5px black;
}

.menu {

    margin-top: 25px;

    display: flex;

    flex-direction: column;

    gap: 14px;

    width: 320px;
}

.botao {

    position: relative;

    width: 280px;

    padding: 13px 28px;

    background: transparent;

    border: none;

    color: #dddddd;

    text-align: left;

    font-family: Georgia, serif;

    font-size: 25px;

    cursor: pointer;

    transition: 0.3s;

    text-shadow: 0 2px 4px black;
}

.botao::before {

    content: "";

    position: absolute;

    inset: 0;

    z-index: -1;

    background: #777;

    clip-path: polygon(
        0 0,
        88% 0,
        100% 50%,
        88% 100%,
        0 100%,
        8% 50%
    );

    opacity: 0.75;

    transition: 0.3s;
}

.botao:hover {
    color: white;
    transform: translateX(8px);
}

.botao:hover::before {
    background: #8b1515;
    opacity: 0.95;
    box-shadow: 0 0 20px #8b1515;
}

.jogar {

    font-size: 34px;

    letter-spacing: 3px;

    border: 1px solid rgba(160,20,20,0.7);
}

.jogar::before {

    background: #777;

    box-shadow:
        0 0 0 2px #530000,
        0 0 12px rgba(150,0,0,0.5);
}

.jogar:hover::before {

    background: #9c1717;

    box-shadow:
        0 0 0 2px #b00000,
        0 0 25px rgba(200,0,0,0.7);
}

.desistir {

    width: 170px;

    margin-top: 20px;

    font-size: 18px;

    opacity: 0.75;
}


/* =========================
   SEGUNDA TELA
========================= */

.escolha {

    position: fixed;

    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 35px;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(70,0,0,0.35),
            rgba(5,5,5,0.95) 70%
        );

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.8s ease;
}

.escolha.aparecer {

    opacity: 1;

    visibility: visible;
}

.escolha-titulo {

    font-size: clamp(30px, 6vw, 58px);

    letter-spacing: 5px;

    color: #eeeeee;

    text-shadow:
        0 0 8px #000,
        0 0 25px rgba(150,0,0,0.7);

    margin-bottom: 20px;
}

.opcoes {

    display: flex;

    flex-direction: column;

    gap: 25px;

    width: min(80vw, 600px);
}

.opcao {

    position: relative;

    width: 100%;

    min-height: 120px;

    padding: 25px 30px;

    border: 2px solid #5c0000;

    background:
        linear-gradient(
            90deg,
            #260000,
            #500000,
            #260000
        );

    color: #eeeeee;

    font-family: Georgia, serif;

    cursor: pointer;

    font-size: clamp(22px, 4vw, 34px);

    letter-spacing: 2px;

    transition:
        0.3s;

    box-shadow:
        0 0 15px rgba(100,0,0,0.25);
}

.opcao:hover {

    transform: scale(1.03);

    border-color: #d00000;

    background:
        linear-gradient(
            90deg,
            #500000,
            #900000,
            #500000
        );

    box-shadow:
        0 0 30px rgba(180,0,0,0.55);
}

.opcao-pequeno {

    display: block;

    margin-top: 8px;

    font-size: 15px;

    letter-spacing: 1px;

    color: #c5a5a5;
}


/* =====================================================
   TELA DE CRIAÇÃO DO PERSONAGEM
===================================================== */

.criacao {

    position: fixed;

    inset: 0;

    z-index: 60;

    display: flex;

    flex-direction: column;

    align-items: center;

    overflow-y: auto;

    padding: 50px 20px 70px;

    background:
        radial-gradient(
            circle at center,
            rgba(70,0,0,0.35),
            rgba(5,5,5,0.98) 75%
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.8s ease;
}

.criacao.aparecer {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.criacao-titulo {

    font-size: clamp(30px, 6vw, 55px);

    letter-spacing: 4px;

    color: #eeeeee;

    text-align: center;

    text-shadow:
        0 0 8px #000,
        0 0 25px rgba(150,0,0,0.7);

    margin-bottom: 10px;
}


.criacao-subtitulo {

    color: #bca5a5;

    font-size: 18px;

    text-align: center;

    margin-bottom: 40px;
}


.formulario {

    width: min(90vw, 700px);

    display: flex;

    flex-direction: column;

    gap: 12px;
}


.formulario label {

    color: #dddddd;

    font-size: 20px;

    margin-top: 12px;
}


.campo {

    width: 100%;

    background: rgba(10,10,10,0.95);

    border: 1px solid #650000;

    outline: none;

    color: #eeeeee;

    font-family: Georgia, serif;

    font-size: 18px;

    transition: 0.3s;
}


.campo:focus {

    border-color: #c00000;

    box-shadow:
        0 0 15px rgba(180,0,0,0.35);
}


.nome {

    height: 55px;

    padding: 12px 16px;
}


.historia {

    min-height: 320px;

    padding: 16px;

    resize: vertical;

    line-height: 1.6;
}


.campo::placeholder {

    color: #777777;
}


.botao-continuar {

    align-self: center;

    margin-top: 30px;

    padding: 15px 50px;

    background:
        linear-gradient(
            90deg,
            #420000,
            #790000,
            #420000
        );

    border: 1px solid #900000;

    color: white;

    font-family: Georgia, serif;

    font-size: 21px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.3s;
}


.botao-continuar:hover {

    transform: scale(1.05);

    box-shadow:
        0 0 25px rgba(190,0,0,0.5);
}


/* =========================
   CORTINA
========================= */

.cortina {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #350000,
            #720000,
            #a80000,
            #680000,
            #a80000,
            #680000,
            #a80000,
            #720000,
            #350000
        );

    z-index: 9999;

    transform: translateY(-101%);

    transition:
        transform 1s ease-in-out;

    touch-action: none;

    pointer-events: none;
}


.cortina::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(0,0,0,0.25) 0px,
            rgba(255,255,255,0.08) 30px,
            rgba(0,0,0,0.30) 60px
        );
}


.cortina::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 25%;
    height: 100%;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.08),
            transparent
        );
}


.cortina.fechada {

    transform: translateY(0);

    pointer-events: auto;

    cursor: grab;
}


.cortina.arrastando {

    transition: none;

    cursor: grabbing;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 700px) {

    .interface {

        left: 5%;
        top: 8%;

        width: 55%;
    }

    .titulo {
        font-size: 28px;
    }

    .boasvindas {
        font-size: 20px;
    }

    .botao {

        width: 220px;

        font-size: 20px;
    }

    .jogar {
        font-size: 28px;
    }

    .lua {

        width: 110px;
        height: 110px;

        top: 8%;
        right: 5%;
    }

    .corvo {

        right: 2%;
        top: 24%;

        transform: scale(0.65);
    }

    .opcao {

        min-height: 100px;

        padding: 20px;
    }

}

</style>
</head>


<body>


<!-- =========================
     CENÁRIO
========================= -->

<div class="cenario">

    <div class="estrelas"></div>

    <div class="arvores"></div>

    <div class="cidade"></div>

    <div class="nevoa"></div>

    <div class="lua"></div>

    <div class="estrela"></div>


    <!-- CORVO -->

    <div class="corvo">

        <div class="corvo-corpo"></div>

        <div class="corvo-cabeca">

            <div class="corvo-bico"></div>

        </div>

        <div class="corvo-asa-esquerda"></div>

        <div class="corvo-asa-direita"></div>

        <div class="corvo-cauda"></div>

        <div class="corvo-olho olho-esquerdo"></div>

        <div class="corvo-olho olho-direito"></div>

    </div>


    <!-- =========================
         PRIMEIRA TELA
    ========================= -->

    <section class="interface">

        <h1 class="titulo">
            Nome da Cidade
        </h1>

        <div class="boasvindas">
            Bem-vindo
        </div>

        <div class="menu">

            <button
                class="botao jogar"
                onclick="abrirCortina()"
            >
                JOGAR
            </button>

            <button class="botao">
                CONTINUAR
            </button>

            <button class="botao desistir">
                Desistir
            </button>

        </div>

    </section>

</div>


<!-- =========================
     SEGUNDA TELA
========================= -->

<section class="escolha" id="escolha">

    <h2 class="escolha-titulo">
        ESCOLHA SEU CAMINHO
    </h2>

    <div class="opcoes">

        <button
            class="opcao"
            onclick="abrirCriacao()"
        >

            JOGAR COMO JOGADOR

            <span class="opcao-pequeno">
                Entre na história e viva a aventura.
            </span>

        </button>


        <button class="opcao">

            JOGAR COMO MESTRE

            <span class="opcao-pequeno">
                Conduza a história e controle o mundo.
            </span>

        </button>

    </div>

</section>


<!-- =========================
     TELA DE CRIAÇÃO
========================= -->

<section
    class="criacao"
    id="criacao"
>

    <h2 class="criacao-titulo">
        CRIAÇÃO DO PERSONAGEM
    </h2>


    <p class="criacao-subtitulo">
        Sua história começa aqui.
    </p>


    <div class="formulario">

        <label for="nomePersonagem">
            Nome do personagem
        </label>


        <input
            id="nomePersonagem"
            class="campo nome"
            type="text"
            maxlength="60"
            placeholder="Digite o nome do personagem..."
        >


        <label for="historiaPersonagem">
            História do personagem
        </label>


        <textarea
            id="historiaPersonagem"
            class="campo historia"
            placeholder="Escreva ou cole aqui a história do seu personagem..."
        ></textarea>


        <button
            class="botao-continuar"
            onclick="salvarPersonagem()"
        >
            CONTINUAR
        </button>

    </div>

</section>


<!-- =========================
     CORTINA
========================= -->

<div
    class="cortina"
    id="cortina"
></div>


<script>


/* =========================
   ELEMENTOS
========================= */

const cortina =
    document.getElementById("cortina");

const escolha =
    document.getElementById("escolha");

const criacao =
    document.getElementById("criacao");


/* =========================
   ABRIR CORTINA
========================= */

function abrirCortina() {

    cortina.classList.add("fechada");

}


/* =========================
   ARRASTAR CORTINA
========================= */

let inicioY = 0;

let arrastando = false;

let posicao = 0;


function comecarArrasto(y) {

    if (!cortina.classList.contains("fechada")) {
        return;
    }
