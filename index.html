<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nome da Cidade</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 65% 40%,
                    #353535 0%,
                    #171717 35%,
                    #050505 75%
                );

            color: #eeeeee;
            font-family: Georgia, serif;
        }


        /* =========================
           CENÁRIO
        ========================= */

        .cenario {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }


        /* =========================
           ESTRELAS DO CÉU
        ========================= */

        .estrelas {
            position: absolute;

            inset: 0;

            z-index: 0;

            background-image:
                radial-gradient(circle at 12% 18%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
                radial-gradient(circle at 25% 8%, rgba(255,255,255,0.6) 0 1px, transparent 2px),
                radial-gradient(circle at 38% 22%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
                radial-gradient(circle at 52% 10%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 68% 18%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
                radial-gradient(circle at 82% 7%, rgba(255,255,255,0.6) 0 1px, transparent 2px),
                radial-gradient(circle at 91% 28%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 7% 38%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 31% 35%, rgba(255,255,255,0.4) 0 1px, transparent 2px),
                radial-gradient(circle at 74% 34%, rgba(255,255,255,0.5) 0 1px, transparent 2px);

            animation: estrelasPiscando 5s ease-in-out infinite alternate;
        }

        @keyframes estrelasPiscando {

            from {
                opacity: 0.45;
            }

            to {
                opacity: 0.9;
            }

        }


        /* =========================
           NÉVOA
        ========================= */

        .nevoa {
            position: absolute;

            width: 150%;
            height: 45%;

            left: -25%;
            bottom: 0;

            background: radial-gradient(
                ellipse,
                rgba(180,180,180,0.08),
                transparent 70%
            );

            filter: blur(25px);

            animation: nevoa 12s ease-in-out infinite alternate;
        }

        @keyframes nevoa {

            from {
                transform: translateX(-3%);
            }

            to {
                transform: translateX(3%);
            }

        }


        /* =========================
           ÁRVORES
        ========================= */

        .arvores {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 55%,
                    rgba(0,0,0,0.8) 56%,
                    transparent 57%
                ),
                linear-gradient(
                    70deg,
                    transparent 63%,
                    rgba(0,0,0,0.7) 64%,
                    transparent 65%
                );

            opacity: 0.8;
        }


        /* =========================
           ESTRELA VERMELHA
        ========================= */

        .estrela {
            position: absolute;

            top: 30%;
            left: 42%;

            width: 80px;
            height: 80px;

            transform: rotate(45deg);

            background: #d40000;

            clip-path: polygon(
                50% 0%,
                60% 40%,
                100% 50%,
                60% 60%,
                50% 100%,
                40% 60%,
                0% 50%,
                40% 40%
            );

            filter:
                drop-shadow(0 0 8px rgba(255,0,0,0.8))
                drop-shadow(0 0 20px rgba(255,0,0,0.3));

            animation: pulsar 4s ease-in-out infinite;
        }

        @keyframes pulsar {

            0%, 100% {
                opacity: 0.75;
                transform: rotate(45deg) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.08);
            }

        }


        /* =========================
           LUA
        ========================= */

        .lua {
            position: absolute;

            top: 10%;
            right: 10%;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f4f4f4 0%,
                    #d8d8d8 45%,
                    #a8a8a8 75%,
                    #777777 100%
                );

            box-shadow:
                0 0 15px rgba(255,255,255,0.35),
                0 0 40px rgba(255,255,255,0.18),
                0 0 90px rgba(150,0,0,0.12);

            opacity: 0.9;

            z-index: 2;

            overflow: hidden;
        }


        /* Crateras */

        .lua::before {
            content: "";

            position: absolute;

            width: 38px;
            height: 38px;

            top: 30px;
            left: 35px;

            border-radius: 50%;

            background: rgba(90,90,90,0.22);

            box-shadow:
                55px 15px 0 8px rgba(90,90,90,0.16),
                25px 70px 0 12px rgba(80,80,80,0.18),
                90px 85px 0 6px rgba(70,70,70,0.18),
                70px 115px 0 15px rgba(80,80,80,0.13);
        }


        /* Brilho vermelho */

        .lua::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 70% 60%,
                    rgba(130,0,0,0.18),
                    transparent 55%
                );

            animation: luaPulso 5s ease-in-out infinite;
        }

        @keyframes luaPulso {

            0%, 100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }

        }


        /* =========================
           INTERFACE
        ========================= */

        .interface {
            position: absolute;

            left: 6%;
            top: 12%;

            width: 390px;

            z-index: 5;
        }


        /* Título */

        .titulo {
            position: relative;

            text-align: center;

            padding: 30px 10px;

            font-family: Georgia, serif;

            font-size: clamp(30px, 4vw, 52px);

            letter-spacing: 2px;

            color: #e5e5e5;

            text-shadow:
                0 0 5px #000,
                0 0 15px #000;
        }


        .titulo::before,
        .titulo::after {

            content: "❦";

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            color: #cfcfcf;

            font-size: 45px;
        }

        .titulo::before {
            top: -15px;
        }

        .titulo::after {
            bottom: -15px;
        }


        /* Bem-vindo */

        .boasvindas {

            margin-top: 35px;
            margin-left: 20px;

            font-size: 26px;

            color: #dddddd;

            text-shadow: 0 2px 5px black;
        }


        /* Menu */

        .menu {

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 14px;

            width: 320px;
        }


        /* Botões */

        .botao {

            position: relative;

            width: 280px;

            padding: 13px 28px;

            background: transparent;

            border: none;

            color: #dddddd;

            text-align: left;

            font-family: Georgia, serif;

            font-size: 25px;

            cursor: pointer;

            transition: 0.3s;

            text-shadow: 0 2px 4px black;
        }


        .botao::before {

            content: "";

            position: absolute;

            inset: 0;

            z-index: -1;

            background: #777;

            clip-path: polygon(
                0 0,
                88% 0,
                100% 50%,
                88% 100%,
                0 100%,
                8% 50%
            );

            opacity: 0.75;

            transition: 0.3s;
        }


        .botao:hover {

            color: white;

            transform: translateX(8px);
        }


        .botao:hover::before {

            background: #8b1515;

            opacity: 0.95;

            box-shadow: 0 0 20px #8b1515;
        }


        /* JOGAR */

        .jogar {

            font-size: 34px;

            letter-spacing: 3px;

            border: 1px solid rgba(160,20,20,0.7);
        }


        .jogar::before {

            background: #777;

            box-shadow:
                0 0 0 2px #530000,
                0 0 12px rgba(150,0,0,0.5);
        }


        .jogar:hover::before {

            background: #9c1717;

            box-shadow:
                0 0 0 2px #b00000,
                0 0 25px rgba(200,0,0,0.7);
        }


        /* Desistir */

        .desistir {

            width: 170px;

            margin-top: 20px;

            font-size: 18px;

            opacity: 0.75;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .interface {

                left: 5%;

                top: 8%;

                width: 55%;
            }


            .titulo {

                font-size: 28px;
            }


            .boasvindas {

                font-size: 20px;
            }


            .botao {

                width: 220px;

                font-size: 20px;
            }


            .jogar {

                font-size: 28px;
            }


            .lua {

                width: 110px;
                height: 110px;

                top: 8%;
                right: 5%;
            }

        }

    </style>
</head>


<body>

    <div class="cenario">

        <!-- Estrelas -->
        <div class="estrelas"></div>

        <!-- Árvores -->
        <div class="arvores"></div>

        <!-- Névoa -->
        <div class="nevoa"></div>

        <!-- Estrela vermelha -->
        <div class="estrela"></div>

        <!-- Lua -->
        <div class="lua"></div>


        <!-- Interface -->

        <section class="interface">

            <h1 class="titulo">
                Nome da Cidade
            </h1>


            <div class="boasvindas">
                Bem-vindo
            </div>


            <div class="menu">

                <button class="botao jogar">
                    JOGAR
                </button>


                <button class="botao">
                    CONTINUAR
                </button>


                <button class="botao desistir">
                    Desistir
                </button>

            </div>

        </section>

    </div>


    <script>

        const jogar = document.querySelector(".jogar");

        jogar.addEventListener("click", () => {

            alert("A cortina será adicionada aqui.");

        });

    </script>

</body>

    </html>
