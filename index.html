<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nome da Cidade</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 65% 40%,
                    #353535 0%,
                    #171717 35%,
                    #050505 75%
                );

            color: #eeeeee;
            font-family: Georgia, serif;
        }


        /* =========================
           CENÁRIO
        ========================= */

        .cenario {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }


        /* =========================
           ESTRELAS
        ========================= */

        .estrelas {
            position: absolute;
            inset: 0;
            z-index: 0;

            background-image:
                radial-gradient(circle at 12% 18%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
                radial-gradient(circle at 25% 8%, rgba(255,255,255,0.6) 0 1px, transparent 2px),
                radial-gradient(circle at 38% 22%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
                radial-gradient(circle at 52% 10%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 68% 18%, rgba(255,255,255,0.7) 0 1px, transparent 2px),
                radial-gradient(circle at 82% 7%, rgba(255,255,255,0.6) 0 1px, transparent 2px),
                radial-gradient(circle at 91% 28%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 7% 38%, rgba(255,255,255,0.5) 0 1px, transparent 2px),
                radial-gradient(circle at 31% 35%, rgba(255,255,255,0.4) 0 1px, transparent 2px),
                radial-gradient(circle at 74% 34%, rgba(255,255,255,0.5) 0 1px, transparent 2px);

            animation: estrelasPiscando 5s ease-in-out infinite alternate;
        }

        @keyframes estrelasPiscando {

            from {
                opacity: 0.45;
            }

            to {
                opacity: 0.9;
            }

        }


        /* =========================
           ÁRVORES
        ========================= */

        .arvores {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 55%,
                    rgba(0,0,0,0.8) 56%,
                    transparent 57%
                ),
                linear-gradient(
                    70deg,
                    transparent 63%,
                    rgba(0,0,0,0.7) 64%,
                    transparent 65%
                );

            opacity: 0.8;
            z-index: 1;
        }


        /* =========================
           CIDADE
        ========================= */

        .cidade {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 38%;

            z-index: 2;

            background:
                linear-gradient(
                    to top,
                    #030303 0%,
                    #080808 45%,
                    transparent 100%
                );

            clip-path: polygon(
                0 65%,
                5% 62%,
                5% 48%,
                10% 48%,
                10% 58%,
                15% 58%,
                15% 35%,
                20% 35%,
                20% 55%,
                25% 55%,
                25% 42%,
                30% 42%,
                30% 53%,
                36% 53%,
                36% 30%,
                41% 30%,
                41% 50%,
                47% 50%,
                47% 40%,
                52% 40%,
                52% 55%,
                58% 55%,
                58% 32%,
                64% 32%,
                64% 50%,
                70% 50%,
                70% 38%,
                76% 38%,
                76% 54%,
                82% 54%,
                82% 43%,
                88% 43%,
                88% 55%,
                94% 55%,
                94% 46%,
                100% 46%,
                100% 100%,
                0 100%
            );

            opacity: 0.9;
        }


        .cidade::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(circle at 18% 65%, rgba(180,0,0,0.7) 0 2px, transparent 4px),
                radial-gradient(circle at 29% 58%, rgba(220,0,0,0.55) 0 2px, transparent 4px),
                radial-gradient(circle at 42% 67%, rgba(180,0,0,0.65) 0 2px, transparent 4px),
                radial-gradient(circle at 60% 60%, rgba(220,0,0,0.55) 0 2px, transparent 4px),
                radial-gradient(circle at 72% 67%, rgba(180,0,0,0.65) 0 2px, transparent 4px),
                radial-gradient(circle at 86% 61%, rgba(220,0,0,0.5) 0 2px, transparent 4px);

            animation: luzesCidade 4s ease-in-out infinite alternate;
        }

        @keyframes luzesCidade {

            from {
                opacity: 0.55;
            }

            to {
                opacity: 1;
            }

        }


        .cidade::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 70%;

            background:
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(120,0,0,0.28),
                    transparent 65%
                );

            animation: horizonteVermelho 6s ease-in-out infinite alternate;
        }

        @keyframes horizonteVermelho {

            from {
                opacity: 0.35;
            }

            to {
                opacity: 0.8;
            }

        }


        /* =========================
           NÉVOA
        ========================= */

        .nevoa {
            position: absolute;

            width: 160%;
            height: 48%;

            left: -30%;
            bottom: -5%;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(210,210,210,0.11),
                    rgba(120,120,120,0.04) 45%,
                    transparent 72%
                );

            filter: blur(25px);

            animation: nevoa 12s ease-in-out infinite alternate;

            z-index: 3;
        }

        @keyframes nevoa {

            from {
                transform: translateX(-4%) scale(1);
            }

            to {
                transform: translateX(4%) scale(1.04);
            }

        }


        .nevoa::after {
            content: "";

            position: absolute;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    ellipse at 55% 90%,
                    rgba(130,0,0,0.12),
                    transparent 60%
                );

            animation: nevoaVermelha 7s ease-in-out infinite alternate;
        }

        @keyframes nevoaVermelha {

            from {
                opacity: 0.2;
            }

            to {
                opacity: 0.7;
            }

        }


        /* =========================
           LUA
        ========================= */

        .lua {
            position: absolute;

            top: 10%;
            right: 10%;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #f4f4f4 0%,
                    #d8d8d8 45%,
                    #a8a8a8 75%,
                    #777777 100%
                );

            box-shadow:
                0 0 15px rgba(255,255,255,0.35),
                0 0 40px rgba(255,255,255,0.18),
                0 0 90px rgba(150,0,0,0.12);

            opacity: 0.9;

            z-index: 2;

            overflow: hidden;
        }


        .lua::before {
            content: "";

            position: absolute;

            width: 38px;
            height: 38px;

            top: 30px;
            left: 35px;

            border-radius: 50%;

            background: rgba(90,90,90,0.22);

            box-shadow:
                55px 15px 0 8px rgba(90,90,90,0.16),
                25px 70px 0 12px rgba(80,80,80,0.18),
                90px 85px 0 6px rgba(70,70,70,0.18),
                70px 115px 0 15px rgba(80,80,80,0.13);
        }


        .lua::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 70% 60%,
                    rgba(130,0,0,0.18),
                    transparent 55%
                );

            animation: luaPulso 5s ease-in-out infinite;
        }

        @keyframes luaPulso {

            0%, 100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.8;
            }

        }


        /* =========================
           ESTRELA VERMELHA
        ========================= */

        .estrela {
            position: absolute;

            top: 30%;
            left: 42%;

            width: 80px;
            height: 80px;

            transform: rotate(45deg);

            background: #d40000;

            clip-path: polygon(
                50% 0%,
                60% 40%,
                100% 50%,
                60% 60%,
                50% 100%,
                40% 60%,
                0% 50%,
                40% 40%
            );

            filter:
                drop-shadow(0 0 8px rgba(255,0,0,0.8))
                drop-shadow(0 0 20px rgba(255,0,0,0.3));

            animation: pulsar 4s ease-in-out infinite;

            z-index: 4;
        }

        @keyframes pulsar {

            0%, 100% {
                opacity: 0.75;
                transform: rotate(45deg) scale(0.95);
            }

            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.08);
            }

        }


        /* =========================
           CORVO
        ========================= */

        .corvo {
            position: absolute;

            right: 13%;
            top: 22%;

            width: 230px;
            height: 180px;

            z-index: 6;

            transform: rotate(-6deg);

            animation: corvoFlutuar 4s ease-in-out infinite;
        }

        @keyframes corvoFlutuar {

            0%, 100% {
                transform: translateY(0) rotate(-6deg);
            }

            50% {
                transform: translateY(-7px) rotate(-4deg);
            }

        }


        .corvo-corpo {
            position: absolute;

            width: 105px;
            height: 125px;

            right: 45px;
            top: 45px;

            background: #050505;

            border-radius: 50% 45% 40% 45%;

            transform: rotate(-10deg);

            box-shadow:
                -12px 10px 20px rgba(0,0,0,0.7),
                inset 12px -10px 20px rgba(60,60,60,0.12);
        }


        .corvo-cabeca {
            position: absolute;

            width: 78px;
            height: 78px;

            right: 25px;
            top: 18px;

            background: #030303;

            border-radius: 55% 50% 45% 50%;

            z-index: 2;
        }


        .corvo-bico {
            position: absolute;

            right: -65px;
            top: 45px;

            width: 75px;
            height: 28px;

            background: #050505;

            clip-path: polygon(
                0 0,
                100% 50%,
                0 100%
            );

            transform: rotate(-5deg);
        }


        .corvo-asa-esquerda {
            position: absolute;

            width: 135px;
            height: 70px;

            left: 5px;
            top: 45px;

            background: #020202;

            border-radius: 80% 20% 80% 20%;

            transform: rotate(18deg);
        }


        .corvo-asa-direita {
            position: absolute;

            width: 125px;
            height: 65px;

            right: 35px;
            top: 95px;

            background: #020202;

            border-radius: 20% 80% 20% 80%;

            transform: rotate(-25deg);
        }


        .corvo-cauda {
            position: absolute;

            left: 35px;
            bottom: 5px;

            width: 105px;
            height: 60px;

            background: #020202;

            clip-path: polygon(
                100% 0,
                0 20%,
                35% 50%,
                0 80%,
                100% 100%
            );

            transform: rotate(8deg);
        }


        .corvo-olho {

            position: absolute;

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: #ff0000;

            box-shadow:
                0 0 5px #ff0000,
                0 0 15px rgba(255,0,0,0.9),
                0 0 28px rgba(255,0,0,0.5);

            z-index: 5;

            animation: olhosCorvo 2.5s ease-in-out infinite;
        }


        .olho-esquerdo {
            right: 70px;
            top: 48px;
        }


        .olho-direito {
            right: 50px;
            top: 49px;
        }


        @keyframes olhosCorvo {

            0%, 100% {
                opacity: 0.75;
            }

            50% {
                opacity: 1;
            }

        }


        /* =========================
           INTERFACE
        ========================= */

        .interface {
            position: absolute;

            left: 6%;
            top: 12%;

            width: 390px;

            z-index: 10;
        }


        .titulo {
            position: relative;

            text-align: center;

            padding: 30px 10px;

            font-size: clamp(30px, 4vw, 52px);

            letter-spacing: 2px;

            color: #e5e5e5;

            text-shadow:
                0 0 5px #000,
                0 0 15px #000;
        }


        .titulo::before,
        .titulo::after {

            content: "❦";

            position: absolute;

            left: 50%;

            transform: translateX(-50%);

            color: #cfcfcf;

            font-size: 45px;
        }

        .titulo::before {
            top: -15px;
        }

        .titulo::after {
            bottom: -15px;
        }


        .boasvindas {

            margin-top: 35px;
            margin-left: 20px;

            font-size: 26px;

            color: #dddddd;

            text-shadow: 0 2px 5px black;
        }


        .menu {

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 14px;

            width: 320px;
        }


        .botao {

            position: relative;

            width: 280px;

            padding: 13px 28px;

            background: transparent;

            border: none;

            color: #dddddd;

            text-align: left;

            font-family: Georgia, serif;

            font-size: 25px;

            cursor: pointer;

            transition: 0.3s;

            text-shadow: 0 2px 4px black;
        }


        .botao::before {

            content: "";

            position: absolute;

            inset: 0;

            z-index: -1;

            background: #777;

            clip-path: polygon(
                0 0,
                88% 0,
                100% 50%,
                88% 100%,
                0 100%,
                8% 50%
            );

            opacity: 0.75;

            transition: 0.3s;
        }


        .botao:hover {

            color: white;

            transform: translateX(8px);
        }


        .botao:hover::before {

            background: #8b1515;

            opacity: 0.95;

            box-shadow: 0 0 20px #8b1515;
        }


        .jogar {

            font-size: 34px;

            letter-spacing: 3px;

            border: 1px solid rgba(160,20,20,0.7);
        }


        .jogar::before {

            background: #777;

            box-shadow:
                0 0 0 2px #530000,
                0 0 12px rgba(150,0,0,0.5);
        }


        .jogar:hover::before {

            background: #9c1717;

            box-shadow:
                0 0 0 2px #b00000,
                0 0 25px rgba(200,0,0,0.7);
        }


        .desistir {

            width: 170px;

            margin-top: 20px;

            font-size: 18px;

            opacity: 0.75;
        }


        /* =========================
           CORTINA
        ========================= */

        .cortina {
    position: fixed;
    inset: 0;

    z-index: 100;

    background:
        linear-gradient(
            90deg,
            #3a0000,
            #8b0000,
            #b30000,
            #700000,
            #a80000,
            #700000,
            #b30000,
            #8b0000,
            #3a0000
        );

    transform: translateY(-100%);

    transition: transform 0.9s ease-in-out;

    touch-action: none;

    pointer-events: none;

    box-shadow:
        inset 0 0 80px rgba(0,0,0,0.5);
            }

        /* Cortina fechada */

        .cortina.fechada {
    transform: translateY(0);

    pointer-events: auto;
        }


        /* Cortina sendo arrastada */

        .cortina.arrastando {

            transition: none;

            cursor: grabbing;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .interface {

                left: 5%;
                top: 8%;

                width: 55%;
            }


            .titulo {
                font-size: 28px;
            }


            .boasvindas {
                font-size: 20px;
            }


            .botao {

                width: 220px;

                font-size: 20px;
            }


            .jogar {
                font-size: 28px;
            }


            .lua {

                width: 110px;
                height: 110px;

                top: 8%;
                right: 5%;
            }


            .corvo {

                right: 2%;
                top: 24%;
