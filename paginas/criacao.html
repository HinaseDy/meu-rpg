<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criação de Personagem</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    width: 100%;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #351010 0%,
            #120606 45%,
            #030303 100%
        );

    color: #eeeeee;

    font-family: Georgia, serif;

    overflow-x: hidden;
}


/* =========================
   FUNDO
========================= */

.fundo {

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(180,0,0,0.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(180,0,0,0.08),
            transparent 30%
        );

}


/* =========================
   CONTAINER
========================= */

.container {

    position: relative;

    width: min(900px, 90%);

    margin: auto;

    padding: 50px 0 80px;

    z-index: 2;

}


/* =========================
   TÍTULO
========================= */

.titulo {

    text-align: center;

    font-size: clamp(32px, 6vw, 58px);

    letter-spacing: 5px;

    margin-bottom: 10px;

    text-shadow:
        0 0 10px #000,
        0 0 25px rgba(180,0,0,0.5);

}


.subtitulo {

    text-align: center;

    color: #bdaaaa;

    font-size: 17px;

    margin-bottom: 45px;

}


/* =========================
   CARTÃO
========================= */

.cartao {

    position: relative;

    padding: 35px;

    margin-bottom: 25px;

    background:
        linear-gradient(
            135deg,
            rgba(35,0,0,0.95),
            rgba(10,10,10,0.95)
        );

    border: 1px solid #5c0000;

    box-shadow:
        0 0 25px rgba(100,0,0,0.25);

}


/* =========================
   TÍTULOS DAS SEÇÕES
========================= */

.titulo-secao {

    font-size: 25px;

    letter-spacing: 2px;

    color: #e5caca;

    margin-bottom: 25px;

    border-bottom: 1px solid #5c0000;

    padding-bottom: 12px;

}


/* =========================
   CAMPOS
========================= */

.campo {

    margin-bottom: 22px;

}


.campo label {

    display: block;

    margin-bottom: 8px;

    font-size: 18px;

    color: #d9d9d9;

}


.campo input,
.campo textarea,
.campo select {

    width: 100%;

    padding: 14px 16px;

    background: #080808;

    color: #eeeeee;

    border: 1px solid #5c0000;

    outline: none;

    font-family: Georgia, serif;

    font-size: 17px;

    transition: 0.3s;

}


.campo textarea {

    min-height: 120px;

    resize: vertical;

}


.campo input:focus,
.campo textarea:focus,
.campo select:focus {

    border-color: #c00000;

    box-shadow:
        0 0 15px rgba(180,0,0,0.25);

}


/* =========================
   ATRIBUTOS
========================= */

.atributos {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;

}


.atributo {

    padding: 18px;

    background: #090909;

    border: 1px solid #400000;

}


.atributo-nome {

    display: block;

    margin-bottom: 8px;

    color: #d5baba;

}


.atributo input {

    width: 100%;

}


/* =========================
   BOTÃO COMEÇAR
========================= */

.comecar {

    display: block;

    width: min(400px, 90%);

    margin: 40px auto 0;

    padding: 18px;

    border: 2px solid #760000;

    background:
        linear-gradient(
            90deg,
            #300000,
            #750000,
            #300000
        );

    color: #ffffff;

    font-family: Georgia, serif;

    font-size: 27px;

    letter-spacing: 3px;

    cursor: pointer;

    transition: 0.3s;

    box-shadow:
        0 0 20px rgba(150,0,0,0.3);

}


.comecar:hover {

    transform: scale(1.04);

    background:
        linear-gradient(
            90deg,
            #600000,
            #a00000,
            #600000
        );

    border-color: #d00000;

    box-shadow:
        0 0 30px rgba(200,0,0,0.6);

}


/* =========================
   VOLTAR
========================= */

.voltar {

    display: block;

    margin: 25px auto 0;

    background: none;

    border: none;

    color: #999999;

    font-family: Georgia, serif;

    font-size: 16px;

    cursor: pointer;

}


.voltar:hover {

    color: #ffffff;

}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    .container {

        padding-top: 30px;

    }

    .cartao {

        padding: 22px;

    }

    .atributos {

        grid-template-columns: 1fr;

    }

    .titulo {

        font-size: 34px;

    }

}

</style>

</head>


<body>


<div class="fundo"></div>


<main class="container">


    <!-- TÍTULO -->

    <h1 class="titulo">
        CRIAÇÃO DE PERSONAGEM
    </h1>

    <p class="subtitulo">
        Antes de entrar na história, conte-nos quem você é.
    </p>


    <!-- IDENTIDADE -->

    <section class="cartao">

        <h2 class="titulo-secao">
            IDENTIDADE
        </h2>


        <div class="campo">

            <label>
                Nome do personagem
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome..."
            >

        </div>


        <div class="campo">

            <label>
                Idade
            </label>

            <input
                type="number"
                id="idade"
                placeholder="Digite a idade..."
            >

        </div>


        <div class="campo">

            <label>
                Profissão
            </label>

            <input
                type="text"
                id="profissao"
                placeholder="Ex.: Detetive, médico, jornalista..."
            >

        </div>


        <div class="campo">

            <label>
                História do personagem
            </label>

            <textarea
                id="historia"
                placeholder="Conte um pouco sobre o passado do personagem..."
            ></textarea>

        </div>

    </section>


    <!-- ATRIBUTOS -->

    <section class="cartao">

        <h2 class="titulo-secao">
            ATRIBUTOS
        </h2>


        <div class="atributos">


            <div class="atributo">

                <span class="atributo-nome">
                    Inteligência
                </span>

                <input
                    type="number"
                    id="inteligencia"
                    value="0"
                >

            </div>


            <div class="atributo">

                <span class="atributo-nome">
                    Força
                </span>

                <input
                    type="number"
                    id="forca"
                    value="0"
                >

            </div>


            <div class="atributo">

                <span class="atributo-nome">
                    Agilidade
                </span>

                <input
                    type="number"
                    id="agilidade"
                    value="0"
                >

            </div>


            <div class="atributo">

                <span class="atributo-nome">
                    Vigor
                </span>

                <input
                    type="number"
                    id="vigor"
                    value="0"
                >

            </div>


            <div class="atributo">

                <span class="atributo-nome">
                    Presença
                </span>

                <input
                    type="number"
                    id="presenca"
                    value="0"
                >

            </div>


            <div class="atributo">

                <span class="atributo-nome">
                    Percepção
                </span>

                <input
                    type="number"
                    id="percepcao"
                    value="0"
                >

            </div>


        </div>

    </section>


    <!-- BOTÃO -->

    <button
        class="comecar"
        onclick="comecarJogo()"
    >
        COMEÇAR
    </button>


    <button
        class="voltar"
        onclick="voltar()"
    >
        ← Voltar
    </button>


</main>


<script>


/* =========================
   COMEÇAR
========================= */

function comecarJogo() {

    const nome =
        document.getElementById("nome").value;


    if (nome.trim() === "") {

        alert(
            "Primeiro, dê um nome ao seu personagem."
        );

        return;

    }


    /*
       POR ENQUANTO,
       APENAS MOSTRA UMA MENSAGEM.

       Depois vamos fazer o botão
       levar para a verdadeira aventura.
    */

    alert(
        "Personagem criado!\n\n" +
        "Bem-vindo à história, " +
        nome + "."
    );

}


/* =========================
   VOLTAR
========================= */

function voltar() {

    window.history.back();

}

</script>


</body>

  </html>
