<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Criação de Personagem</title>


<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 30%,
            #3a0505 0%,
            #160000 45%,
            #050505 85%
        );

    color: #eeeeee;

    font-family: Georgia, serif;

    overflow-x: hidden;
}


/* =========================
   ESTRELAS
========================= */

.estrelas {

    position: fixed;

    inset: 0;

    background-image:

        radial-gradient(
            circle at 12% 18%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 25% 8%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 38% 22%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 52% 10%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 68% 18%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 82% 7%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 91% 28%,
            white 0 1px,
            transparent 2px
        );

    opacity: 0.45;

    pointer-events: none;
}


/* =========================
   CONTEÚDO
========================= */

.conteudo {

    position: relative;

    z-index: 2;

    width: min(92%, 750px);

    margin: auto;

    padding: 50px 0 80px;
}


/* =========================
   TÍTULO
========================= */

.titulo {

    text-align: center;

    font-size:
        clamp(32px, 7vw, 58px);

    letter-spacing: 5px;

    text-shadow:
        0 0 8px #000,
        0 0 25px rgba(180,0,0,0.7);

    margin-bottom: 10px;
}


.subtitulo {

    text-align: center;

    color: #c9aaaa;

    font-size: 18px;

    letter-spacing: 2px;

    margin-bottom: 40px;
}


/* =========================
   CARTÃO
========================= */

.cartao {

    padding: 35px;

    background:

        linear-gradient(
            135deg,
            rgba(70,0,0,0.85),
            rgba(12,12,12,0.96)
        );

    border: 2px solid #650000;

    box-shadow:
        0 0 30px rgba(120,0,0,0.35);

    border-radius: 5px;
}


/* =========================
   CAMPOS
========================= */

.campo {

    margin-bottom: 25px;
}


.campo label {

    display: block;

    margin-bottom: 8px;

    color: #d8c2c2;

    font-size: 18px;
}


.campo input,
.campo select,
.campo textarea {

    width: 100%;

    padding: 14px;

    background: #090909;

    border: 1px solid #650000;

    color: white;

    font-family: Georgia, serif;

    font-size: 17px;

    outline: none;

    border-radius: 3px;

    transition: 0.3s;
}


.campo input:focus,
.campo select:focus,
.campo textarea:focus {

    border-color: #c00000;

    box-shadow:
        0 0 12px rgba(190,0,0,0.35);
}


/* =========================
   HISTÓRIA
========================= */

.historia-label {

    margin-top: 10px;
}


.historia-info {

    display: block;

    margin-top: -3px;

    margin-bottom: 10px;

    color: #9e8585;

    font-size: 14px;
}


.campo textarea {

    min-height: 350px;

    resize: vertical;

    line-height: 1.6;
}


/* =========================
   BOTÃO
========================= */

.botao {

    width: 100%;

    padding: 18px;

    margin-top: 10px;

    background:

        linear-gradient(
            90deg,
            #4b0000,
            #850000,
            #4b0000
        );

    border: 1px solid #a00000;

    color: white;

    font-family: Georgia, serif;

    font-size: 21px;

    letter-spacing: 2px;

    cursor: pointer;

    transition: 0.3s;
}


.botao:hover {

    transform: scale(1.02);

    box-shadow:
        0 0 25px rgba(200,0,0,0.6);
}


/* =========================
   MENSAGEM
========================= */

.mensagem {

    text-align: center;

    margin-top: 20px;

    min-height: 25px;

    color: #d00000;

    font-size: 17px;
}


.mensagem.sucesso {

    color: #b8b8b8;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    .conteudo {

        width: 94%;

        padding-top: 30px;
    }

    .cartao {

        padding: 22px;
    }

    .campo textarea {

        min-height: 300px;
    }

}

</style>

</head>


<body>


<div class="estrelas"></div>


<div class="conteudo">


    <h1 class="titulo">
        CRIAÇÃO
    </h1>


    <p class="subtitulo">
        Dê vida ao seu personagem.
    </p>


    <div class="cartao">


        <!-- =========================
             NOME
        ========================= -->

        <div class="campo">

            <label for="nome">
                Nome do personagem
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o nome..."
            >

        </div>


        <!-- =========================
             IDADE
        ========================= -->

        <div class="campo">

            <label for="idade">
                Idade
            </label>

            <input
                type="number"
                id="idade"
                min="1"
                placeholder="Digite a idade..."
            >

        </div>


        <!-- =========================
             GÊNERO
        ========================= -->

        <div class="campo">

            <label for="genero">
                Gênero
            </label>

            <select id="genero">

                <option value="">
                    Selecione...
                </option>

                <option value="Masculino">
                    Masculino
                </option>

                <option value="Feminino">
                    Feminino
                </option>

                <option value="Outro">
                    Outro
                </option>

                <option value="Prefiro não informar">
                    Prefiro não informar
                </option>

            </select>

        </div>


        <!-- =========================
             HISTÓRIA
        ========================= -->

        <div class="campo">

            <label
                for="historia"
                class="historia-label"
            >
                História do personagem
            </label>

            <span class="historia-info">
                Conte livremente a história do seu personagem.
            </span>

            <textarea
                id="historia"
                placeholder="Escreva a história do seu personagem..."
            ></textarea>

        </div>


        <!-- =========================
             FINALIZAR
        ========================= -->

        <button
            class="botao"
            onclick="salvarEFinalizar()"
        >
            SALVAR E FINALIZAR
        </button>


        <div
            class="mensagem"
            id="mensagem"
        ></div>


    </div>

</div>


<script>

/* =========================
   SALVAR E FINALIZAR
========================= */

function salvarEFinalizar() {


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const idade =
        document
        .getElementById("idade")
        .value;


    const genero =
        document
        .getElementById("genero")
        .value;


    const historia =
        document
        .getElementById("historia")
        .value;


    /* =========================
       VERIFICAÇÃO
    ========================= */

    if (nome === "") {

        mostrarMensagem(
            "Digite o nome do personagem."
        );

        return;
    }


    if (idade === "") {

        mostrarMensagem(
            "Digite a idade do personagem."
        );

        return;
    }


    if (historia.trim() === "") {

        mostrarMensagem(
            "Escreva a história do personagem."
        );

        return;
    }


    /* =========================
       PERSONAGEM
    ========================= */

    const personagem = {

        nome: nome,

        idade: idade,

        genero: genero,

        historia: historia,

        criadoEm:
            new Date().toISOString()

    };


    /* =========================
       SALVAR
========================= */

    localStorage.setItem(

        "personagemRPG",

        JSON.stringify(personagem)

    );


    /* =========================
       IR PARA A FICHA
    ========================= */

    window.location.href =
        "ficha.html";

}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(
    texto,
    sucesso = false
) {

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.textContent =
        texto;


    mensagem.className =
        sucesso
        ? "mensagem sucesso"
        : "mensagem";

}


/* =========================
   CARREGAR PERSONAGEM
========================= */

function carregarPersonagem() {


    const salvo =
        localStorage.getItem(
            "personagemRPG"
        );


    if (!salvo) {

        return;

    }


    try {

        const personagem =
            JSON.parse(salvo);


        document
            .getElementById("nome")
            .value =
            personagem.nome || "";


        document
            .getElementById("idade")
            .value =
            personagem.idade || "";


        document
            .getElementById("genero")
            .value =
            personagem.genero || "";


        document
            .getElementById("historia")
            .value =
            personagem.historia || "";


    }

    catch (erro) {

        console.log(
            "Não foi possível carregar o personagem."
        );

    }

}


/* =========================
   INICIAR
========================= */

carregarPersonagem();

</script>


</body>

                </html>
