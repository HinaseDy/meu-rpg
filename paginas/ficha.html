<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ficha do Personagem</title>


<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            #3a0505 0%,
            #160000 40%,
            #050505 85%
        );

    color: #eeeeee;

    font-family: Georgia, serif;

    overflow-x: hidden;
}


/* =========================
   ESTRELAS
========================= */

.estrelas {

    position: fixed;

    inset: 0;

    background-image:

        radial-gradient(
            circle at 12% 18%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 25% 8%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 38% 22%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 52% 10%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 68% 18%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 82% 7%,
            white 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 91% 28%,
            white 0 1px,
            transparent 2px
        );

    opacity: 0.35;

    pointer-events: none;
}


/* =========================
   CONTAINER
========================= */

.container {

    position: relative;

    z-index: 2;

    width: min(95%, 1100px);

    margin: auto;

    padding: 30px 0 60px;
}


/* =========================
   CABEÇALHO
========================= */

.cabecalho {

    text-align: center;

    margin-bottom: 25px;
}


.nome-personagem {

    font-size:
        clamp(30px, 7vw, 55px);

    letter-spacing: 4px;

    text-shadow:
        0 0 10px #000,
        0 0 25px rgba(180,0,0,0.7);
}


.info-personagem {

    margin-top: 10px;

    color: #bdaaaa;

    font-size: 17px;

    letter-spacing: 1px;
}


/* =========================
   ABAS
========================= */

.abas {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-bottom: 25px;
}


.aba {

    padding: 13px 20px;

    background: #170000;

    border: 1px solid #650000;

    color: #cdbbbb;

    font-family: Georgia, serif;

    font-size: 16px;

    cursor: pointer;

    transition: 0.25s;
}


.aba:hover {

    background: #420000;

    color: white;
}


.aba.ativa {

    background: #850000;

    border-color: #c00000;

    color: white;

    box-shadow:
        0 0 15px rgba(180,0,0,0.45);
}


/* =========================
   ABA CONTEÚDO
========================= */

.pagina {

    display: none;
}


.pagina.ativa {

    display: block;
}


/* =========================
   CARTÃO
========================= */

.cartao {

    background:

        linear-gradient(
            135deg,
            rgba(55,0,0,0.88),
            rgba(10,10,10,0.96)
        );

    border: 1px solid #650000;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow:
        0 0 25px rgba(100,0,0,0.25);
}


.titulo-secao {

    font-size: 27px;

    margin-bottom: 20px;

    color: #eeeeee;

    letter-spacing: 2px;
}


/* =========================
   ATRIBUTOS
========================= */

.atributos {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 15px;
}


.atributo {

    background: #090909;

    border: 1px solid #5c0000;

    padding: 18px;

    text-align: center;
}


.atributo-nome {

    display: block;

    font-size: 18px;

    color: #cdbbbb;

    margin-bottom: 12px;
}


.valor-atributo {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 12px;
}


.valor {

    font-size: 30px;

    min-width: 35px;

    color: white;
}


.controle {

    width: 35px;

    height: 35px;

    background: #420000;

    border: 1px solid #850000;

    color: white;

    font-size: 22px;

    cursor: pointer;
}


.controle:hover {

    background: #900000;
}


/* =========================
   PONTOS
========================= */

.pontos {

    margin-top: 20px;

    text-align: center;

    color: #c9aaaa;

    font-size: 18px;
}


.pontos span {

    color: white;

    font-size: 23px;
}


/* =========================
   RECURSOS
========================= */

.recursos {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

    gap: 18px;
}


.recurso {

    background: #090909;

    border: 1px solid #5c0000;

    padding: 20px;

    text-align: center;
}


.recurso-nome {

    display: block;

    margin-bottom: 12px;

    font-size: 20px;

    color: #cdbbbb;
}


.recurso-controle {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;
}


.recurso-valor {

    width: 70px;

    padding: 8px;

    background: #050505;

    border: 1px solid #650000;

    color: white;

    text-align: center;

    font-size: 22px;
}


/* =========================
   PERÍCIAS
========================= */

.pericias {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 12px;
}


.pericia {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px;

    background: #090909;

    border: 1px solid #4d0000;
}


.pericia-nome {

    font-size: 17px;
}


.pericia-atributo {

    color: #9f8585;

    font-size: 13px;

    margin-top: 4px;
}


.pericia-valor {

    font-size: 22px;

    color: #d00000;
}


/* =========================
   TEIA
========================= */

.teia-intro {

    color: #c8baba;

    line-height: 1.6;

    margin-bottom: 25px;
}


.teia {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 20px;
}


.habilidade {

    min-height: 150px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 15px;

    background: #120000;

    border: 2px solid #650000;

    cursor: pointer;

    transition: 0.3s;
}


.habilidade:hover {

    transform: translateY(-5px);

    border-color: #d00000;

    box-shadow:
        0 0 20px rgba(200,0,0,0.5);
}


.habilidade.bloqueada {

    opacity: 0.45;

    cursor: not-allowed;
}


.icone-habilidade {

    width: 55px;

    height: 55px;

    display: flex;

    justify-content: center;

    align-items: center;

    margin-bottom: 10px;

    background: #350000;

    border: 2px solid #850000;

    transform: rotate(45deg);
}


.icone-habilidade span {

    transform: rotate(-45deg);

    font-size: 25px;
}


.habilidade-nome {

    margin-top: 8px;

    font-size: 16px;
}


.habilidade-custo {

    margin-top: 8px;

    color: #d00000;

    font-size: 14px;
}


/* =========================
   LORE
========================= */

textarea {

    width: 100%;

    min-height: 300px;

    padding: 15px;

    resize: vertical;

    background: #070707;

    border: 1px solid #650000;

    color: white;

    font-family: Georgia, serif;

    font-size: 17px;

    line-height: 1.6;
}


/* =========================
   INVENTÁRIO
========================= */

.inventario {

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.item {

    display: flex;

    align-items: center;

    gap: 10px;
}


.item input {

    flex: 1;

    padding: 13px;

    background: #070707;

    border: 1px solid #650000;

    color: white;

    font-family: Georgia, serif;
}


.remover {

    padding: 12px 15px;

    background: #420000;

    border: 1px solid #850000;

    color: white;

    cursor: pointer;
}


.botao {

    padding: 14px 20px;

    margin-top: 15px;

    background:
        linear-gradient(
            90deg,
            #4b0000,
            #850000,
            #4b0000
        );

    border: 1px solid #a00000;

    color: white;

    font-family: Georgia, serif;

    cursor: pointer;

    font-size: 16px;
}


.botao:hover {

    box-shadow:
        0 0 20px rgba(200,0,0,0.5);
}


/* =========================
   HISTÓRIA
========================= */

.historia {

    white-space: pre-wrap;

    line-height: 1.7;

    color: #cdbebe;

    font-size: 17px;
}


/* =========================
   RESPONSIVO
========================= */

@media (max-width: 600px) {

    .container {

        width: 94%;

        padding-top: 20px;
    }


    .cartao {

        padding: 18px;
    }


    .aba {

        flex: 1 1 40%;

        padding: 12px 8px;

        font-size: 14px;
    }

}

</style>

</head>
